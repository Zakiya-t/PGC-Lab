<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <rect width="1500" height="820" fill="#f7f9fc"/>
  <rect x="70" y="45" width="1360" height="110" rx="24" fill="#173e73"/>
  <text x="750" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Parallel Matrix Multiplication</text>
  <text x="750" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#dfeaf8">One 4000 × 4000 workload • Four computing models • One correctness check</text>

  <rect x="475" y="185" width="550" height="78" rx="18" fill="#ffffff" stroke="#173e73" stroke-width="3"/>
  <text x="750" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#173e73">A, B = 4000 × 4000</text>
  <text x="750" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5d73">All initialized to 1.0 → compute C = A × B</text>
  <line x1="750" y1="263" x2="750" y2="302" stroke="#173e73" stroke-width="4"/>
  <polygon points="750,316 738,298 762,298" fill="#173e73"/>

  <!-- connector lines -->
  <line x1="750" y1="316" x2="195" y2="316" stroke="#173e73" stroke-width="4"/>
  <line x1="750" y1="316" x2="525" y2="316" stroke="#173e73" stroke-width="4"/>
  <line x1="750" y1="316" x2="975" y2="316" stroke="#173e73" stroke-width="4"/>
  <line x1="750" y1="316" x2="1305" y2="316" stroke="#173e73" stroke-width="4"/>
  <line x1="195" y1="316" x2="195" y2="344" stroke="#173e73" stroke-width="4"/>
  <line x1="525" y1="316" x2="525" y2="344" stroke="#173e73" stroke-width="4"/>
  <line x1="975" y1="316" x2="975" y2="344" stroke="#173e73" stroke-width="4"/>
  <line x1="1305" y1="316" x2="1305" y2="344" stroke="#173e73" stroke-width="4"/>

  <!-- cards -->
  <g>
    <rect x="65" y="344" width="260" height="250" rx="20" fill="#ffffff" stroke="#173e73" stroke-width="3"/>
    <rect x="65" y="344" width="260" height="56" rx="20" fill="#173e73"/>
    <text x="195" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SEQUENTIAL</text>
    <text x="88" y="433" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Execution</text>
    <text x="88" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">Single CPU flow</text>
    <text x="88" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Core idea</text>
    <text x="88" y="521" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">Triple nested loops</text>
    <text x="88" y="559" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Measured</text>
    <text x="88" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">339.308583 s</text>
  </g>

  <g>
    <rect x="395" y="344" width="260" height="250" rx="20" fill="#ffffff" stroke="#173e73" stroke-width="3"/>
    <rect x="395" y="344" width="260" height="56" rx="20" fill="#173e73"/>
    <text x="525" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">OPENMP</text>
    <text x="418" y="433" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Execution</text>
    <text x="418" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">Shared-memory CPU</text>
    <text x="418" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Core idea</text>
    <text x="418" y="521" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">8 threads • parallel for</text>
    <text x="418" y="559" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Measured</text>
    <text x="418" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">107.938463 s</text>
  </g>

  <g>
    <rect x="845" y="344" width="260" height="250" rx="20" fill="#ffffff" stroke="#173e73" stroke-width="3"/>
    <rect x="845" y="344" width="260" height="56" rx="20" fill="#173e73"/>
    <text x="975" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">MPI</text>
    <text x="868" y="433" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Execution</text>
    <text x="868" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">Distributed memory</text>
    <text x="868" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Core idea</text>
    <text x="868" y="521" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">4 ranks • 1000 rows/rank</text>
    <text x="868" y="559" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Measured</text>
    <text x="868" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">226.167575 s</text>
  </g>

  <g>
    <rect x="1175" y="344" width="260" height="250" rx="20" fill="#ffffff" stroke="#173e73" stroke-width="3"/>
    <rect x="1175" y="344" width="260" height="56" rx="20" fill="#173e73"/>
    <text x="1305" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">CUDA</text>
    <text x="1198" y="433" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Execution</text>
    <text x="1198" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">GPU parallelism</text>
    <text x="1198" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Core idea</text>
    <text x="1198" y="521" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">16×16 block • 250×250 grid</text>
    <text x="1198" y="559" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#173e73">Measured</text>
    <text x="1198" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5d73">0.211245 s kernel</text>
  </g>

  <!-- convergence -->
  <line x1="195" y1="594" x2="195" y2="635" stroke="#173e73" stroke-width="4"/>
  <line x1="525" y1="594" x2="525" y2="635" stroke="#173e73" stroke-width="4"/>
  <line x1="975" y1="594" x2="975" y2="635" stroke="#173e73" stroke-width="4"/>
  <line x1="1305" y1="594" x2="1305" y2="635" stroke="#173e73" stroke-width="4"/>
  <line x1="195" y1="635" x2="1305" y2="635" stroke="#173e73" stroke-width="4"/>
  <line x1="750" y1="635" x2="750" y2="668" stroke="#173e73" stroke-width="4"/>
  <polygon points="750,682 738,664 762,664" fill="#173e73"/>

  <rect x="520" y="682" width="460" height="64" rx="18" fill="#e9f1fb" stroke="#173e73" stroke-width="3"/>
  <text x="750" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173e73">Verify C[0][0] = 4000.00</text>
  <text x="750" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5d73">Same mathematical workload • Different execution strategy</text>
</svg>
